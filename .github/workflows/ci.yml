name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    # WPF (net10.0-windows) is part of the solution, so the build must run on Windows.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET (pinned by global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Rambla.slnx

      # dotnet format evaluates the workspace in the default (Debug) configuration,
      # and the [State] generator is an analyzer ProjectReference — its DLL must
      # exist or every generated member comes up missing (CS0535).
      - name: Build generators (needed by dotnet format)
        run: dotnet build src/Rambla.Generators/Rambla.Generators.csproj --no-restore

      - name: Verify formatting
        run: dotnet format Rambla.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Rambla.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Rambla.slnx --configuration Release --no-build --verbosity normal

      # The repository builds through ProjectReference, but package consumers get
      # the [State]/[StateCommand] generator from Rambla.nupkg. Compile a clean
      # consumer against the exact package produced in this run to verify that
      # analyzer payload and its generated API before a release ever reaches NuGet.
      - name: Pack packages for consumer smoke test
        run: >
          dotnet pack Rambla.slnx --configuration Release --no-build
          -p:Version=0.0.0-ci
          -o ${{ runner.temp }}/rambla-packages

      - name: Verify packed core from a clean consumer
        run: >
          dotnet restore tests/Rambla.PackageSmoke/Rambla.PackageSmoke.csproj
          -p:RamblaPackageVersion=0.0.0-ci
          --source ${{ runner.temp }}/rambla-packages

      - name: Build packed-package consumer
        run: >
          dotnet build tests/Rambla.PackageSmoke/Rambla.PackageSmoke.csproj
          --configuration Release --no-restore
          -p:RamblaPackageVersion=0.0.0-ci
